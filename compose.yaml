services:
  blog:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE to the image tag or digest to deploy}
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
