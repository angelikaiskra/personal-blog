service: blog
image: angelikaiskra/personal-blog
minimum_version: 2.12.0

servers:
  web:
    hosts:
      - <%= ENV.fetch('DEPLOY_HOST') %>
    options:
      init: true
      memory: 384m
      cap-drop:
        - ALL
      security-opt:
        - no-new-privileges:true

registry:
  server: ghcr.io
  username: <%= ENV.fetch('KAMAL_REGISTRY_USERNAME') %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

ssh:
  user: blog-deploy
  keys:
    - <%= ENV.fetch('DEPLOY_SSH_KEY_PATH') %>
  keys_only: true
  config: <%= ENV.fetch('DEPLOY_SSH_CONFIG').tap { |path| File.read(path) } %>
  forward_agent: false

proxy:
  host: angelaiskra.com
  app_port: 3000
  ssl: false
  forward_headers: true
  response_timeout: 30
  healthcheck:
    path: /api/health
    interval: 1
    timeout: 5
  buffering:
    requests: false
    responses: false
  run:
    http_port: 8080
    https_port: 8443
    bind_ips:
      - 127.0.0.1
    version: v0.9.2
    log_max_size: ''
    options:
      log-driver: journald

asset_path: /app/.next/static
retain_containers: 3
deploy_timeout: 60
drain_timeout: 30
stop_timeout: 30

logging:
  driver: local
  options:
    max-size: 10m
    max-file: '3'
