name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/angelikaiskra/personal-blog:${{ github.sha }}

jobs:
  build:
    name: Build and check image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=blog
          cache-to: type=gha,mode=max,scope=blog

      - name: Smoke test
        run: |
          docker run --detach --name blog-ci --publish 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs blog-ci' ERR
          for path in / /api/health /blog /rss.xml /sitemap.xml '/_next/image?url=%2Favatar.webp&w=64&q=75'; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 15 --retry-all-errors --retry-delay 1 "http://127.0.0.1:3000$path"
          done

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"

  deploy:
    name: Deploy with Kamal
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: blog-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KAMAL_CLI_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7b5be276aa17bbe122887f6a1ff12865f4848111989699b9786083be95d98415
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  ConnectTimeout 15' '  StrictHostKeyChecking yes' \
            '  HostKeyAlgorithms ssh-ed25519' "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  GlobalKnownHostsFile /dev/null' > "$ssh_dir/config"
          echo "DEPLOY_SSH_KEY_PATH=$ssh_dir/key" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_CONFIG=$ssh_dir/config" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workdir,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/ssh,target=$RUNNER_TEMP/ssh,readonly" \
            --env DEPLOY_HOST --env DEPLOY_SSH_KEY_PATH --env DEPLOY_SSH_CONFIG \
            --env KAMAL_REGISTRY_USERNAME --env KAMAL_REGISTRY_PASSWORD \
            "$KAMAL_CLI_IMAGE" deploy --skip-push --version "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 900

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Check live release
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://angelaiskra.com/api/health |
            jq --exit-status --arg release "$GITHUB_SHA" '.release == $release'

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
