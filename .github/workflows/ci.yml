name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and check production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: blog:ci
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=blog
          cache-to: type=gha,mode=max,scope=blog

      - name: Check pages and image optimization
        shell: bash
        run: |
          docker run --detach --name blog-ci --init \
            --publish 127.0.0.1:3000:3000 \
            --cap-drop ALL --security-opt no-new-privileges \
            blog:ci
          trap 'docker logs blog-ci; docker rm --force blog-ci' EXIT

          check_url() {
            local path="$1"
            shift
            local response
            response=$(curl --fail --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code} %{content_type}' \
              "$@" "http://127.0.0.1:3000${path}")
            if [[ "$response" != "200 "* ]]; then
              echo "Expected HTTP 200 for $path, got: $response" >&2
              return 1
            fi
            if [[ "$path" == /_next/image\?* && "$response" != "200 image/"* ]]; then
              echo "Expected an image content type for $path, got: $response" >&2
              return 1
            fi
          }

          check_url / --max-time 10 --retry 15 --retry-all-errors --retry-delay 1
          for path in /blog /blog/how-i-built-animated-3d-cat /rss.xml /sitemap.xml; do
            check_url "$path"
          done
          check_url '/_next/image?url=%2Favatar.webp&w=64&q=75'

      - name: Save checked image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/blog-image.tar" blog:ci

      - name: Upload checked image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-image
          path: ${{ runner.temp }}/blog-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Docker image
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download checked image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-image
          path: ${{ runner.temp }}

      - name: Load checked image
        run: docker load --input "$RUNNER_TEMP/blog-image.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Publish checked image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker tag blog:ci "$IMAGE:$COMMIT_SHA"
          docker push "$IMAGE:$COMMIT_SHA"
          reference=$(docker image inspect "$IMAGE:$COMMIT_SHA" --format '{{index .RepoDigests 0}}')
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Record deployment image
        env:
          IMAGE_REFERENCE: ${{ steps.publish.outputs.reference }}
        run: echo "Deploy image $IMAGE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"

  verify_deployment_access:
    name: Verify production access
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: prod
    permissions:
      id-token: write
    steps:
      - name: Inspect AWS OIDC claims
        shell: bash
        env:
          DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          node --input-type=module <<'NODE'
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) {
            throw new Error('GitHub OIDC request credentials are unavailable');
          }

          const url = new URL(requestUrl);
          url.searchParams.set('audience', 'sts.amazonaws.com');
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) {
            throw new Error(`OIDC request failed with HTTP ${response.status}`);
          }

          const { value } = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
          console.log(JSON.stringify({
            role: process.env.DEPLOY_ROLE_ARN,
            aud: claims.aud,
            sub: claims.sub,
            ref: claims.ref,
            environment: claims.environment,
          }, null, 2));
          NODE

      - name: Assume production AWS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: '796310349380'
          role-duration-seconds: 900
          role-session-name: blog-ci-${{ github.run_id }}
          retry-max-attempts: 3

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text

      - name: Check restricted deployment SSH connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST variable}"
          : "${SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS secret}"

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/blog-deploy-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"

          timeout 60s ssh -F /dev/null -T \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -i "$ssh_dir/key" \
            "blog-deploy@$DEPLOY_HOST" check
