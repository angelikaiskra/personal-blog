name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KAMAL_CLI_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7b5be276aa17bbe122887f6a1ff12865f4848111989699b9786083be95d98415
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          printf '%s\n' 'Host *' '  BatchMode yes' '  ConnectTimeout 15' '  StrictHostKeyChecking yes' \
            '  HostKeyAlgorithms ssh-ed25519' "  UserKnownHostsFile $ssh_dir/known_hosts" \
            '  GlobalKnownHostsFile /dev/null' > "$ssh_dir/config"
          echo "DEPLOY_SSH_KEY_PATH=$ssh_dir/key" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_CONFIG=$ssh_dir/config" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workdir,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/ssh,target=$RUNNER_TEMP/ssh,readonly" \
            --env DEPLOY_HOST --env DEPLOY_SSH_KEY_PATH --env DEPLOY_SSH_CONFIG \
            --env KAMAL_REGISTRY_USERNAME --env KAMAL_REGISTRY_PASSWORD \
            "$KAMAL_CLI_IMAGE" deploy --skip-push --version "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 1800

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Check live release
        run: |
          body=$(curl --fail --silent --show-error --retry 5 --retry-all-errors https://angelaiskra.com/api/health)
          echo "$body"
          echo "Live release: \`$(jq --raw-output .release <<< "$body")\`" >> "$GITHUB_STEP_SUMMARY"
          jq --exit-status --arg release "$GITHUB_SHA" '.release == $release' <<< "$body"

      - name: Collect server logs
        if: failure()
        run: |
          ssh -F "$DEPLOY_SSH_CONFIG" -i "$DEPLOY_SSH_KEY_PATH" -o IdentitiesOnly=yes \
            "blog-deploy@$DEPLOY_HOST" sh -s <<EOF
          echo '--- containers'
          docker ps --all --filter label=service=blog --format 'table {{.Names}}\t{{.Status}}'
          echo '--- new container state'
          docker inspect --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' blog-web-$GITHUB_SHA
          echo '--- new container logs'
          docker logs --tail 100 blog-web-$GITHUB_SHA
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
