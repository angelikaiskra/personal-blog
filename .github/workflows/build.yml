name: Build

on:
  workflow_call:
    inputs:
      push:
        description: Push the checked image to GHCR
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/angelikaiskra/personal-blog:${{ github.sha }}

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.2.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        id: content
        run: pnpm validate:content

      - name: ESLint
        if: ${{ !cancelled() && steps.content.outcome == 'success' }}
        run: pnpm lint

      - name: Prettier
        if: ${{ !cancelled() && steps.content.outcome == 'success' }}
        run: pnpm lint:prettier-check

      - name: Typecheck
        if: ${{ !cancelled() && steps.content.outcome == 'success' }}
        run: pnpm typecheck

  build:
    name: Build and check image
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=blog
          cache-to: type=gha,mode=max,scope=blog

      - name: Smoke test
        run: |
          docker run --detach --name blog-ci --init --memory 384m --cap-drop ALL \
            --security-opt no-new-privileges:true --publish 127.0.0.1:3000:3000 "$IMAGE"
          trap 'echo "::group::Container logs"; docker logs blog-ci; echo "::endgroup::"' ERR
          for path in / /api/health /blog /rss.xml /sitemap.xml '/_next/image?url=%2Favatar.webp&w=64&q=75'; do
            curl --fail --silent --show-error --output /dev/null --write-out '%{http_code} %{url_effective}\n' \
              --retry 15 --retry-all-errors --retry-delay 1 "http://127.0.0.1:3000$path"
          done

      - name: Push image
        if: inputs.push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "Pushed \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
