name: Deploy with Kamal

on:
  workflow_dispatch:
    inputs:
      release:
        description: Checked release from the successful CI summary
        required: true
        type: string
      digest:
        description: Published image digest from that same CI summary (sha256:...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: blog-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      RELEASE: ${{ inputs.release }}
      EXPECTED_IMAGE_DIGEST: ${{ inputs.digest }}
      KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KAMAL_CLI_IMAGE: ghcr.io/basecamp/kamal:v2.12.0@sha256:7b5be276aa17bbe122887f6a1ff12865f4848111989699b9786083be95d98415
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the selected checked image
        shell: bash
        run: |
          [[ "$RELEASE" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$EXPECTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          image=ghcr.io/angelikaiskra/personal-blog
          docker manifest inspect --verbose "$image:$RELEASE" > "$RUNNER_TEMP/manifest.json"
          jq --exit-status --arg digest "$EXPECTED_IMAGE_DIGEST" \
            '.Descriptor.digest == $digest' "$RUNNER_TEMP/manifest.json"

      - name: Prepare verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Missing deployment key}"
          : "${SSH_KNOWN_HOSTS:?Missing verified host keys}"
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/kamal-ssh.XXXXXX")
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          {
            printf '%s\n' 'Host *' '  BatchMode yes' '  ConnectTimeout 15' \
              '  StrictHostKeyChecking yes' '  GlobalKnownHostsFile /dev/null' \
              '  IdentitiesOnly yes' '  IdentityAgent none' \
              '  HostKeyAlgorithms ssh-ed25519' '  ForwardAgent no'
            printf '  UserKnownHostsFile "%s/known_hosts"\n' "$ssh_dir"
          } > "$ssh_dir/config"
          echo "DEPLOY_SSH_KEY_PATH=$ssh_dir/key" >> "$GITHUB_ENV"
          echo "DEPLOY_SSH_CONFIG=$ssh_dir/config" >> "$GITHUB_ENV"

      - name: Verify Compose still owns the Caddy upstream
        shell: bash
        run: |
          timeout 30s ssh -F "$DEPLOY_SSH_CONFIG" -T -i "$DEPLOY_SSH_KEY_PATH" \
            "blog-deploy@$DEPLOY_HOST" 'curl --fail --silent --show-error --max-time 10 http://127.0.0.1:2019/config/' | \
            jq --exit-status '[.. | objects | select(.handler? == "reverse_proxy") | .upstreams[]?.dial] as $upstreams |
              ($upstreams | length) > 0 and all($upstreams[]; . == "127.0.0.1:3000" or . == "localhost:3000")'
          timeout 60s ssh -F "$DEPLOY_SSH_CONFIG" -T -i "$DEPLOY_SSH_KEY_PATH" \
            "blog-deploy@$DEPLOY_HOST" 'python3 -' <<'PY'
          import json
          import shutil
          import subprocess
          compose = json.loads(subprocess.check_output(['docker', 'inspect', 'blog-blog-1']))[0]
          if not compose['State']['Running'] or compose['State'].get('OOMKilled'):
              raise SystemExit('Compose fallback is not running normally.')
          if shutil.disk_usage('/').free < 1024 ** 3:
              raise SystemExit('Less than 1 GiB free disk space; inspect before pulling images.')
          mem = {line.split(':')[0]: int(line.split()[1]) for line in open('/proc/meminfo')}
          if mem['MemAvailable'] / mem['MemTotal'] < 0.15:
              raise SystemExit('Available memory is below 15%; inspect before starting another container.')
          subprocess.run(['free', '-m'], check=True)
          subprocess.run(['df', '-h', '/'], check=True)
          print('Caddy still serves Compose. Fallback image:', compose['Image'])
          PY
          restarts=$(ssh -F "$DEPLOY_SSH_CONFIG" -T -i "$DEPLOY_SSH_KEY_PATH" \
            "blog-deploy@$DEPLOY_HOST" "docker inspect blog-blog-1 --format '{{.RestartCount}}'")
          [[ "$restarts" =~ ^[0-9]+$ ]]
          echo "BASELINE_COMPOSE_RESTARTS=$restarts" >> "$GITHUB_ENV"

      - name: Deploy checked image behind the loopback proxy
        shell: bash
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workdir,readonly" \
            --mount "type=bind,source=${DEPLOY_SSH_CONFIG%/*},target=${DEPLOY_SSH_CONFIG%/*},readonly" \
            --env DEPLOY_HOST --env DEPLOY_SSH_KEY_PATH --env DEPLOY_SSH_CONFIG \
            --env KAMAL_REGISTRY_USERNAME --env KAMAL_REGISTRY_PASSWORD \
            --env EXPECTED_IMAGE_DIGEST \
            "$KAMAL_CLI_IMAGE" deploy --skip-push --version "$RELEASE"

      - name: Check health, homepage, and memory
        shell: bash
        run: |
          timeout 180s ssh -F "$DEPLOY_SSH_CONFIG" -T -i "$DEPLOY_SSH_KEY_PATH" \
            "blog-deploy@$DEPLOY_HOST" "python3 - '$RELEASE' '$BASELINE_COMPOSE_RESTARTS'" <<'PY'
          import json
          import subprocess
          import sys
          import urllib.request

          release = sys.argv[1]
          def fetch(path, port=8080):
              request = urllib.request.Request(f'http://127.0.0.1:{port}{path}', headers={'Host': 'angelaiskra.com'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 200:
                      raise SystemExit(f'{path} returned {response.status}, expected 200.')
                  body, headers = response.read(), response.headers
              print(f'{path}: 200')
              return body, headers

          body, headers = fetch('/api/health')
          if json.loads(body) != {'status': 'ok', 'release': release} or 'no-store' not in headers.get('Cache-Control', ''):
              raise SystemExit('Candidate health identity or cache header is incorrect.')
          fetch('/')
          fetch('/', port=3000)
          mem = {line.split(':')[0]: int(line.split()[1]) for line in open('/proc/meminfo')}
          if mem['MemAvailable'] / mem['MemTotal'] < 0.15:
              raise SystemExit('Available memory is below 15%; inspect capacity before proceeding.')
          candidate = json.loads(subprocess.check_output(['docker', 'inspect', f'blog-web-{release}']))[0]
          compose = json.loads(subprocess.check_output(['docker', 'inspect', 'blog-blog-1']))[0]
          for container in (candidate, compose):
              if not container['State']['Running'] or container['State'].get('OOMKilled'):
                  raise SystemExit('Unexpected container stop, OOM kill, or restart; inspect before proceeding.')
          if candidate['RestartCount'] or compose['RestartCount'] != int(sys.argv[2]):
              raise SystemExit('A container restarted during deployment; inspect before proceeding.')
          subprocess.run(['free', '-m'], check=True)
          subprocess.run(['df', '-h', '/'], check=True)
          subprocess.run(['docker', 'stats', '--no-stream'], check=True)
          PY

      - name: Record deployment outcome
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            printf 'Initial deployment outcome: %s\n\n' "$RESULT"
            printf 'Release: %s\n\nDigest: %s\n\n' "$RELEASE" "$EXPECTED_IMAGE_DIGEST"
            printf 'Configuration commit: %s\n\n' "$GITHUB_SHA"
            printf '%s\n' 'Public Caddy upstream was not changed. Inspect failed or interrupted runs before retrying.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: |
          if [[ -n "${DEPLOY_SSH_CONFIG:-}" ]]; then
            ssh_dir=${DEPLOY_SSH_CONFIG%/*}
            rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts" "$ssh_dir/config"
            rmdir -- "$ssh_dir"
          fi
