version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '16:00'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      next:
        patterns: ['next', 'eslint-config-next']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '16:00'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '16:00'
      timezone: Europe/Warsaw
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
